<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GuardCam</title>
  <style>
    html, body, #root {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0A0A0F;
      overflow: hidden;
    }
    /* Simulate phone viewport */
    @media (min-width: 500px) {
      #root {
        max-width: 430px;
        max-height: 932px;
        margin: 20px auto;
        border-radius: 24px;
        border: 2px solid rgba(255,255,255,0.08);
        overflow: hidden;
        box-shadow: 0 0 60px rgba(0,255,136,0.1);
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
